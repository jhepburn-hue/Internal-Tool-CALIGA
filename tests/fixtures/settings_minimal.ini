; A cut-down settings_default.ini for tests: the sections and keys the INI builder writes, with
; made-up defaults. The real file is company data and is never committed.
[av]
silence_beeper = false
; Supported colors:
; - "off"
; - "red"
; - "green"
; - "blue"
; - "amber"
; - "magenta"
; - "white"
idle_color = "white"

[ble]
enabled = true

[ble/adv_data]
; Name complete value. Max size 5 characters
name_complete = "APEX"

[ble/configure]
secure_transactions = true
allow_credentials = false

[host_communication]
; - "auto_detect"
; - "osdp"
; - "wiegand"
mode = "auto_detect"

[mfg_data]
cfg_id = 0xFFFF

[mypass]
allow_credentials = false
km1_se_slot_nb = 0
km2_se_slot_nb = 0
kc1_se_slot_nb = 0
kc2_se_slot_nb = 0
all_keys = true

[rfid/av]
led_enabled = true
; - "off"
; - "red"
; - "green"
; - "blue"
; - "amber"
; - "magenta"
; - "white"
color = "green"

[rfid/lf]
enabled = true
filter_enabled = false
; - "equal"
; - "less_or_equal"
; - "greater_or_equal"
; - "not_equal"
filter_function = "less_or_equal"
filter_bit_len = 50
filter_mask = "0000000000"
filter_value = "FFFFFFFFFF"
; - "casi_01"
; - "casi_02"
ask_output_format = "casi_02"

[rfid/hf/nfc]
enabled_protocols = "ABFV"

[rfid/hf/app/csn]
enabled = true
mifare_classic_format = 0x0000
mifare_plus_format = 0x0000
mifare_ultralight_format = 0x0000
mifare_desfire_format = 0x0000
iso14443a_cl1_format = 0x0000
iso14443a_cl2_format = 0x0000
iso14443b_format = 0x0000
felica_format = 0x0000
iso15693_format = 0x0000
pico15693_format = 0x0000

[rfid/hf/app/iclass]
enabled = false
auth_err_report_csn = false

[rfid/hf/app/leaf/desfire]
enabled = false

[rfid/hf/app/leaf/desfire/1]
enabled = false
app_id = "000000"
card_key_nb = 0
se_key_nb = 0

[rfid/hf/app/leaf/desfire/2]
enabled = false
app_id = "000000"
card_key_nb = 0
se_key_nb = 0

[rfid/hf/app/leaf/desfire/3]
enabled = false
app_id = "000000"
card_key_nb = 0
se_key_nb = 0

[rfid/hf/app/leaf/duox/openid]
enabled = false

[rfid/hf/app/meridian]
enabled = false
privacy_se_key_nb = 0
credential_se_key_nb = 0
bit_nb = 40

[rfid/hf/app/mifare_2go/generic]
enabled = false
se_key_nb = 0

[rfid/hf/app/mypass]
enabled = false

[rfid/hf/app/nexpacs]
enabled = false

[rfid/hf/app/wallet]
terminal_id = "000000"

[tamper]
wiegand_reporting_enabled = true
osdp_reporting_enabled = true

[wiegand]
; - "4_bit"
; - "8_bit"
; - "26_bit"
; - "magstripe_4"
; - "magstripe_5"
default_format = "8_bit"

[keys]
slot01 = Lk00001:Kaw
slot02 = Lk00001:Kv2
slot03 = Ck00001:KM1
slot04 = Ck00001:KC1
slot05 = Lk00001:Kr0
slot06 = Lk00001:Kr1
slot07 = Lk00001:Kr5
slot11 = "N/A"
slot12 = "N/A"
slot13 = "N/A"
slot14 = "N/A"
slot15 = "N/A"
slot16 = "N/A"
slot17 = "N/A"
