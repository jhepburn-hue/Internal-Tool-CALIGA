<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALIGA Internal Tool</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        .navbar-brand { 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        .card { 
            background-color: #1e1e1e; 
            border: 1px solid #2d2d2d; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .bg-dark-subtle-custom {
            background-color: #252525 !important;
        }

        .status-production { color: #32CD32 !important; } 
        .status-active     { color: #00BFFF !important; } 
        .status-poc        { color: #FF7F00 !important; } 
        .status-archived   { color: #FF3333 !important; } 

        .role-header-navy {
            color: #52b788 !important; 
        }

        .badge-navy-green {
            background-color: #1b4332 !important;
            color: #e8f5e9 !important;
            border: 1px solid #2d6a4f;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="{{ url_for('home') }}">CALIGA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/configurations') %}active{% endif %}" 
                        href="{{ url_for('configurations_list') }}">Configurations</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">Testing</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Failures</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('tools') }}">Tools</a></li>
                </ul>
                
                {% if current_user %}
                <div class="d-flex align-items-center text-light">
                    <span class="me-2">User: <strong>{{ current_user.first_name }} {{ current_user.last_name_initial }}.</strong></span>
                    <span class="badge badge-navy-green px-2 py-1">{{ current_user.role }}</span>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
