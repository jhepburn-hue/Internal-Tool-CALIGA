{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mb-4">
    <a href="{{ url_for('tools') }}" class="btn btn-sm btn-outline-secondary mb-3 align-self-start">&larr; Back to Tools</a>
    <h3 class="fw-bold text-light mb-3">INI Translator</h3>
    <form method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <label class="form-label text-secondary fw-bold">Upload INI File</label>
            <input type="file" name="ini_file" class="form-control bg-dark text-light border-secondary" accept=".ini" required>
        </div>
        <button type="submit" class="btn btn-info">Translate to English</button>
    </form>

    {% if output %}
        <h5 class="fw-bold text-light mt-4">Translated Output</h5>
        <pre class="bg-dark text-success p-3 rounded border border-secondary">{{ output }}</pre>
    {% endif %}
</div>
{% endblock %}
